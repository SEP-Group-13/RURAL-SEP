
openapi: 3.1.0
info:
  title: RURAL SEP API
  version: 0.1.0
  description: |
    Contract between the RURAL SEP dashboard (client) and the data service (server).
    All responses contain personal or study data and are sent with Cache-Control: no-store.
servers:
  - url: /api

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check. Touches no personal data.
      tags: [system]
      responses:
        "200":
          description: The service is up
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [data, redirect]
                properties:
                  data:
                    $ref: "#/components/schemas/Health"
                  redirect:
                    type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /participants/summary:
    get:
      operationId: getParticipantSummary
      summary: Aggregate participant counts by study status. Returns counts only, no individual records.
      tags: [participants]
      responses:
        "200":
          description: Participant counts
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [data, redirect]
                properties:
                  data:
                    $ref: "#/components/schemas/ParticipantSummary"
                  redirect:
                    type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  headers:
    NoStore:
      description: API responses must never be cached
      schema:
        type: string
        enum: [no-store]

  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
          maxLength: 100
        redirect:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ParticipantSummary:
      type: object
      required: [total, byStatus, dropoutReasons]
      properties:
        total:
          type: integer
          minimum: 0
        byStatus:
          type: object
          required: [active, completed, droppedOut]
          properties:
            active: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            droppedOut: { type: integer, minimum: 0 }
        dropoutReasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason:
                type: string
                enum:
                  - Lost to follow-up
                  - No longer eligible
                  - Participant withdrew consent
                  - Technology barrier
                  - Too busy / time burden
                  - Unable to contact
              count:
                type: integer
                minimum: 0

  responses:
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
