services:
  data-service:
    build:
      context: .
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Copy .env.example to .env first}
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATA_SERVICE_PORT:-3000}:3000"
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      # The HTTP listener is opened only after the authenticated database check.
      test:
        - CMD
        - node
        - -e
        - "const socket = require('node:net').connect(3000, '127.0.0.1', () => socket.end()); socket.on('error', () => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
