title: Formula
type: object
description: |
  A numeric column calculated from other columns. The column shows the result for the selected years
  combined; its band column uses the values of each year.
required:
  - name
  - expression
properties:
  name:
    $ref: ../common/ColumnName.yaml
  expression:
    type: string
    description: |
      A math.js expression with column names in square brackets. For example, use `+ - * /`, parentheses,
      `^` for powers and `sqrt(...)` or `max(...)` for numeric functions.
      The result is `null` when a referenced column has no finite numeric value, on division by zero
      or when evaluation fails to produce a finite number.
    examples:
      - '[Time burden (min)] / 360 + [Radiation burden (mSv)] / 10'
      - 'sqrt(([Time burden (min)] / 360)^2 + ([Radiation burden (mSv)] / 10)^2)'
