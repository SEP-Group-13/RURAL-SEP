title: View
type: object
additionalProperties: false
description: |
  The settings that decide which participants and values a request covers. An empty view covers all
  participants and years. Formula and simulation names must differ from each other and from all other columns.
properties:
  years:
    type: array
    minItems: 1
    uniqueItems: true
    description: Calendar years to include. All years when absent.
    items:
      type: integer
  filters:
    type: array
    items:
      $ref: Filter.yaml
  formulas:
    type: array
    items:
      $ref: Formula.yaml
  simulations:
    type: array
    items:
      $ref: Simulation.yaml
  bands:
    type: array
    items:
      $ref: BandSet.yaml
  excludedParticipantIds:
    type: array
    uniqueItems: true
    items:
      type: string
