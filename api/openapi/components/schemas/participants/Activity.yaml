title: Activity
type: object
description: Duration and radiation are `null` when the activity was not completed.
required:
  - date
  - examElement
  - examType
  - additionalStudy
  - location
  - status
  - durationMinutes
  - radiationMsv
properties:
  date:
    type: string
    format: date-time
  examElement:
    type:
      - string
      - 'null'
  examType:
    type: string
    enum:
      - core
      - additional
  additionalStudy:
    type:
      - string
      - 'null'
    description: Name of the additional study. `null` for the core exam.
  location:
    type:
      - string
      - 'null'
  status:
    type: string
    enum:
      - completed
      - notCompleted
  durationMinutes:
    type:
      - number
      - 'null'
  radiationMsv:
    type:
      - number
      - 'null'
